[workspace]
resolver = "2"
members = [
  "crates/emerald-lexer",
  "crates/emerald-parser",
  "crates/emerald-codegen",
  "crates/emerald-sema",
  "crates/emerald-driver",
  "crates/emerald-fmt",
  "crates/emerald-cli",
  "crates/emerald-lsp",
  "crates/emerald-mcp",
  # Plan 91: a second, Rust-compiled static archive alongside
  # `runtime/emerald_runtime.c` — every stdlib expansion plan from 92
  # onward is a tenant of the archive this crate builds.
  "crates/emerald-rt",
]

# Single version and shared metadata for all workspace crates (inherit with version.workspace = true).
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# Plan 27: cargo-dist's GitHub CI support needs a repository URL on
# each dist-packaged crate (emerald-cli/emerald-lsp/emerald-mcp) to
# build release-artifact links; inherited here rather than repeated
# per-crate, matching version/edition/license above.
repository = "https://github.com/Industrial/emerald"

# Plan 27: this block is authentically generated/managed by
# `dist generate` (cargo-dist 0.32.0, installed from the pinned
# nixpkgs `cargo-dist` derivation, which matches `cargo-dist-version`
# below) — see RELEASING.md for the exact commands used and for why
# `targets` stays `x86_64-unknown-linux-gnu`-only for now (macOS/Windows
# builds are untested in this project's sandbox: LLVM-dependent codegen
# and the embedded C runtime archive are cross-compile risk, not verified
# to work, so they are deliberately deferred rather than assumed).
# `dist generate` freely rewrites the comments in this block on every
# re-run — don't hand-edit the generated keys below, only this header.
#
# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Plan 134 (LZ4 Compression): a real, disclosed finding from this
# plan's own EXECUTE-time speed-comparison test (`crates/emerald-rt/
# src/lz4.rs`'s own `#[cfg(test)]` module) — `zstd`'s own C backend
# (`zstd-sys`, `cc`-compiled) is always built at the C compiler's own
# optimization level regardless of Cargo's Rust-side profile, so it
# stays fast under a plain `cargo test`; `lz4_flex` is pure Rust and
# would otherwise compile fully unoptimized under the ordinary `dev`/
# `test` profile `cargo test` uses by default, an apples-to-oranges
# comparison that (measured directly this session) actually reversed
# the real, published, optimized-build throughput relationship this
# plan's own Decision log documents. `opt-level = 3` scoped to just
# this one, small dependency (not a blanket `[profile.dev]` override,
# which would slow every other crate's own dev/test build) restores a
# fair comparison — matching Cargo's own documented use case for
# `[profile.dev.package]` overrides (a slow pure-Rust dependency in an
# otherwise fast-iterating dev build) — but only for the half of the
# test this override alone can reach: see `lz4.rs`'s own test module
# comment for the other half of this same finding (`lz4_flex`'s own
# decompression path still gets re-codegen'd at the CALLING crate's own
# unoptimized level via ordinary per-crate monomorphization, which this
# package override cannot reach at all, since Cargo never applies a
# package override to "the primary package" being built/tested) — see
# `lz4.rs`'s own test comment for the full account, including why the
# comparative speed assertion this override exists for is `#[ignore]`d
# by default rather than paired with a root-level `[profile.test]`
# override: a workspace-wide test-profile change is a permanent compile-
# time cost on every future `cargo test` run for every crate, a
# disproportionate price for one comparative micro-benchmark when the
# correctness tests (round-trip, zero-length, non-UTF8, streaming) need
# no such override at all. This narrower, Cargo-documented-use-case
# override (a single slow-in-debug pure-Rust dependency) is kept since
# it's cheap and correctly scoped; the root-level one was reverted.
[profile.dev.package.lz4_flex]
opt-level = 3
