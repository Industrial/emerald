[package]
name = "emerald-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# Plan 46: the shipped binary is `emerald` (matches `emerald new`/
# `build`/`run`/legacy invocations); the crate/package name stays
# `emerald-cli` for `cargo build -p emerald-cli` and existing tooling.
[[bin]]
name = "emerald"
path = "src/main.rs"

[dependencies]
emerald-parser = { path = "../emerald-parser" }
emerald-sema = { path = "../emerald-sema" }
emerald-codegen = { path = "../emerald-codegen" }
miette = { version = "7", features = ["fancy"] }
id_effect = "0.4"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
cc = "1"
