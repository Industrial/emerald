[package]
name = "emerald-rt"
version.workspace = true
edition.workspace = true
license.workspace = true

# Plan 91: `staticlib` is the artifact `emerald-driver`'s build.rs
# discovers and embeds (`include_bytes!`) into the final `emerald-cli`
# binary, the same role `runtime/emerald_runtime.c`'s own archive
# plays; `rlib` lets this crate's own `#[test]`s run under plain
# `cargo nextest run --workspace`/`cargo test -p emerald-rt`, proving
# the Rust-side logic independently of the FFI/link path.
[lib]
crate-type = ["staticlib", "rlib"]

# No `[profile.release]` override here: Cargo profiles are workspace-
# root-only (a non-root `[profile.*]` table is silently ignored, and
# this plan's own instruction to keep `panic = "unwind"` is already
# this workspace's real, un-overridden default — the root `Cargo.toml`
# sets no `[profile.*]` table of its own at all, verified before
# writing this file rather than assumed). `catch_unwind` at every
# exported function's own boundary (see `src/lib.rs`) only works
# because this default holds; if a future change ever adds a
# workspace-root `panic = "abort"` override, it will silently break
# every native call's exception-to-`Result`/raise conversion, not just
# this crate's own proof function — flagged here so that change finds
# this warning before it finds the bug.

[dependencies]
# Plan 118: real-checked at this plan's own authoring time (2026-09-22,
# via lib.rs since crates.io itself blocks bot access) — serde_json
# 1.0.151 (published Jul 20, 2026), #1 in the Encoding category,
# 116,478,133 downloads/month, used in 156,879 crates (104,196
# directly), owned by dtolnay/serde-rs, MIT/Apache. No RustSec advisory
# against serde_json itself (RUSTSEC-2022-0081 is a different,
# unrelated crate literally named "json"). Pure-Rust, clearing plan
# 95's own pure-Rust-first preference outright — no C-exception needed.
# See crates/emerald-rt/DEPENDENCIES.md for this row's ledger entry.
serde_json = { version = "1", features = ["preserve_order"] }
# Plan 168: real-checked at this plan's own authoring time (2026-09-22,
# via lib.rs) - tracing 0.1.44 (Dec 18, 2025), #1 in Debugging, 67M
# downloads/month, tokio-rs-owned, MIT; tracing-subscriber 0.3.23 (Mar
# 13, 2026), 51M downloads/month, same owners, MIT. RUSTSEC-2025-0055
# (tracing-subscriber ANSI-escape-injection, CVE-2025-58160) is real
# and was checked - patched in >=0.3.20, comfortably below the 0.3.23
# this pin resolves to. Both pure-Rust, no C exception needed.
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["registry"] }
# Plan 123: real-checked at this plan's own authoring time (2026-09-22,
# via lib.rs) - base64 0.23.1 (Aug 4, 2026), #4 in Encoding,
# 123,729,640 downloads/month, used in 95,248 crates, MIT/Apache; hex
# 0.4.3 (Mar 3, 2021, stable/unchanged since), #52 in Encoding,
# 53,852,713 downloads/month, used in 44,269 crates, MIT/Apache. No
# RustSec advisory found against either crate. Both pure-Rust
# (base64's default-on `simd-unsafe` feature is `unsafe`-using SIMD
# purely internal to the crate's own engine dispatch, invisible at
# this API level - no C exception needed). See DEPENDENCIES.md.
base64 = "0.23"
hex = "0.4"
# Plan 122: real-checked at this plan's own authoring time (2026-09-22,
# via lib.rs) - regex 1.13.1 (Jul 15, 2026), #1 in Text processing,
# 91,877,768 downloads/month, used in 105,388 crates, owned directly
# by rust-lang itself, MIT/Apache. Chosen for a real, verified,
# structural security property: RE2-derived finite-automata matching
# guarantees worst-case O(m*n) time with no catastrophic-backtracking/
# ReDoS class at all (confirmed against the crate's own README and
# independent security literature) - the entire reason it lacks
# backreferences/lookaround. No RustSec advisory found.
regex = "1.13"
# Plan 164: real-checked at this plan's own authoring time (2026-09-22,
# via lib.rs) - libm 0.2.16 (Jan 24, 2026), #2 in No-std, 41.8M
# downloads/month, used in 36,355 crates, owned directly by
# rust-lang-owner (the fallback core's own float math already uses on
# targets with no OS-provided math library). No RustSec advisory
# found. Pure Rust, no_std-compatible - portable to wasm32-wasip1
# with zero linker flag, unlike calling libc math via extern "C".
libm = "0.2"
# Plan 162: real-checked at this plan's own authoring time (2026-09-22,
# via lib.rs) - humantime 2.4.0 (Jul 2, 2026), #2 in Date and time,
# 22.0M downloads/month, used in 14,490 crates, "No runtime deps".
# No RustSec advisory found.
humantime = "2"
# Plan 152: real-checked at this plan's own authoring time (2026-09-22,
# via lib.rs) - sysinfo 0.39.6 (Jul 9, 2026), #1 in #process, 16.8M
# downloads/month, used in 6,472 crates, MIT license, MSRV 1.95. No
# RustSec advisory found. C-exception: links libc (and platform-native
# APIs - ntapi on Windows, objc2/IOKit on macOS) to reach OS-specific
# CPU/memory/disk/process introspection - no pure-Rust alternative
# exists for this class of cross-platform system introspection.
sysinfo = "0.39"
# Plan 109: real-checked at this plan's own authoring time (2026-09-22,
# via lib.rs) - sha2 0.11.0 (Mar 25, 2026), #4 in Cryptography, 90.8M
# downloads/month, RustCrypto-owned, MIT/Apache; sha3 0.12.0 (May 15,
# 2026), #1998 in Cryptography, 15.1M downloads/month, RustCrypto-owned,
# MIT/Apache; md-5 0.11.0 (Mar 27, 2026), #2646 in Cryptography, 34.7M
# downloads/month, RustCrypto-owned, MIT/Apache (legacy-interop-only -
# see hashing.rs's own Md5.hash doc comment); blake3 1.8.7 (Aug 20,
# 2026), #3 in Cryptography, 16.8M downloads/month, owned by the
# BLAKE3 design team directly (not RustCrypto - no RustCrypto BLAKE3
# implementation exists to prefer instead), CC0-1.0 OR Apache-2.0. No
# open RustSec advisory found against any of the four at this pin.
# All pure Rust. See DEPENDENCIES.md.
sha2 = "0.11"
sha3 = "0.12"
blake3 = "1.8"
md-5 = "0.11"
# Plan 110: real-checked at this plan's own authoring time (2026-09-22,
# via docs.rs) - aes-gcm 0.11.1 (Aug 21 2026), chacha20poly1305 0.11.0
# (Sep 17 2026), both RustCrypto (github:rustcrypto:aeads), both pure
# Rust, both carrying one NCC Group security audit (2020, funded by
# MobileCoin, no significant findings, per each crate's own README).
# RUSTSEC-2023-0096 (decrypt_in_place_detached exposing unauthenticated
# plaintext) checked - this plan's own `.decrypt` wrapper is built on
# the safe, Vec-returning `aead::Aead::decrypt` only, never the
# in-place/detached API the advisory names, and never affected
# regardless of version. No other open RustSec advisory found against
# either crate. `zeroize` 1.x - RustCrypto-owned, the same
# already-widely-used crate both AEAD crates' own `zeroize` feature
# already pulls in transitively; added here directly so `AeadKey`'s own
# key-material storage in emerald-rt can use `Zeroizing<[u8; 32]>`
# itself, not just rely on it inside the cipher structs. Real, disclosed
# correction found compiling this: neither crate actually has a "std"
# feature (this plan's own text named one) - dropped from both;
# `alloc`/`default` already cover the `Vec`-returning API this plan
# uses.
aead = { version = "0.6", features = ["getrandom"] }
aes-gcm = { version = "0.11", features = ["getrandom", "zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["getrandom", "zeroize"] }
zeroize = "1"
# `getrandom` 0.4.3 - already pulled in transitively by aes-gcm's/
# chacha20poly1305's own "getrandom" feature; added directly here so
# this plan's own nonce/key generation can call `getrandom::fill`
# itself rather than fight the AEAD crates' own generic `Generate`
# trait API (found, empirically, to require type-level plumbing this
# plan's own simple byte-buffer needs don't warrant).
getrandom = "0.4"
# Plan 111: real-checked at this plan's own authoring time (2026-09-22,
# via docs.rs) - ed25519-dalek 3.0.0 (Jul/Sep 2026) and x25519-dalek
# 3.0.0 (Jul/Sep 2026), both dalek-cryptography-owned sibling crates,
# zero open RustSec advisories (ed25519-dalek's one historical
# advisory, RUSTSEC-2022-0093, patched in >=2 - this plan's 3.0 pin is
# two majors past the fix; x25519-dalek's own rustsec.org page 404s -
# no advisory ever filed). rsa 0.9.10 - RustCrypto, one open,
# currently-unpatched advisory (RUSTSEC-2023-0071, the Marvin Attack,
# `patched = []`) - disclosed prominently in asymmetric.rs's own module
# doc and every affected doc comment, not pinned around (no version
# exists to pin around it). All three pure Rust.
ed25519-dalek = "3.0"
x25519-dalek = { version = "3.0", features = ["getrandom", "static_secrets"] }
rsa = "0.9"
# `rand` 0.8 - added specifically because `rsa` 0.9's own `rand_core`
# dependency is pinned to `^0.6.4`, one generation behind the
# `getrandom`/`rand_core 0.10` ecosystem every other crate in this file
# already uses - `rand::rngs::OsRng` is the standard CSPRNG source
# compatible with that older trait generation (the same pairing `rsa`'s
# own README example uses). A real, disclosed extra dependency this
# plan's own text didn't anticipate.
rand = "0.8"
# Plan 117: real-checked at this plan's own authoring time (2026-09-22,
# via lib.rs/docs.rs) - subtle 2.6.1 (unchanged since 2024-06-24),
# dalek-cryptography-owned (isis agora lovecruft, Henry de Valence),
# BSD-3-Clause, 58M downloads/month, used in 2,026 crates. Zero
# runtime dependencies (only a dev-only `rand` 0.8) - the smallest
# possible addition to this ledger of any crate in the 91-191 batch.
subtle = "2.6"

[build-dependencies]
