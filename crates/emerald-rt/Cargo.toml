[package]
name = "emerald-rt"
version.workspace = true
edition.workspace = true
license.workspace = true

# Plan 91: `staticlib` is the artifact `emerald-driver`'s build.rs
# discovers and embeds (`include_bytes!`) into the final `emerald-cli`
# binary, the same role `runtime/emerald_runtime.c`'s own archive
# plays; `rlib` lets this crate's own `#[test]`s run under plain
# `cargo nextest run --workspace`/`cargo test -p emerald-rt`, proving
# the Rust-side logic independently of the FFI/link path.
[lib]
crate-type = ["staticlib", "rlib"]

# No `[profile.release]` override here: Cargo profiles are workspace-
# root-only (a non-root `[profile.*]` table is silently ignored, and
# this plan's own instruction to keep `panic = "unwind"` is already
# this workspace's real, un-overridden default — the root `Cargo.toml`
# sets no `[profile.*]` table of its own at all, verified before
# writing this file rather than assumed). `catch_unwind` at every
# exported function's own boundary (see `src/lib.rs`) only works
# because this default holds; if a future change ever adds a
# workspace-root `panic = "abort"` override, it will silently break
# every native call's exception-to-`Result`/raise conversion, not just
# this crate's own proof function — flagged here so that change finds
# this warning before it finds the bug.

[dependencies]
# Plan 118: real-checked at this plan's own authoring time (2026-09-22,
# via lib.rs since crates.io itself blocks bot access) — serde_json
# 1.0.151 (published Jul 20, 2026), #1 in the Encoding category,
# 116,478,133 downloads/month, used in 156,879 crates (104,196
# directly), owned by dtolnay/serde-rs, MIT/Apache. No RustSec advisory
# against serde_json itself (RUSTSEC-2022-0081 is a different,
# unrelated crate literally named "json"). Pure-Rust, clearing plan
# 95's own pure-Rust-first preference outright — no C-exception needed.
# See crates/emerald-rt/DEPENDENCIES.md for this row's ledger entry.
serde_json = { version = "1", features = ["preserve_order"] }
# Plan 168: real-checked at this plan's own authoring time (2026-09-22,
# via lib.rs) - tracing 0.1.44 (Dec 18, 2025), #1 in Debugging, 67M
# downloads/month, tokio-rs-owned, MIT; tracing-subscriber 0.3.23 (Mar
# 13, 2026), 51M downloads/month, same owners, MIT. RUSTSEC-2025-0055
# (tracing-subscriber ANSI-escape-injection, CVE-2025-58160) is real
# and was checked - patched in >=0.3.20, comfortably below the 0.3.23
# this pin resolves to. Both pure-Rust, no C exception needed.
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["registry"] }
