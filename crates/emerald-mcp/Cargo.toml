[package]
name = "emerald-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
emerald-driver = { path = "../emerald-driver" }
miette = "7"
rmcp = { version = "3.2", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "io-std",
  "process",
] }

[dev-dependencies]
serde_json = "1"
# Client-side-only features (spawning this crate's own binary and
# speaking MCP to it as a client) — not needed by the server binary
# itself, so kept out of the main [dependencies] feature list.
rmcp = { version = "3.2", features = ["client", "transport-child-process"] }
