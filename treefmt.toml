# One CLI to format the code tree - https://github.com/numtide/treefmt

# Do not exit with error if a configured formatter is missing
# Env $TREEFMT_ALLOW_MISSING_FORMATTER
allow-missing-formatter = true

# The file into which a cpu profile will be written
# Env $TREEFMT_CPU_PROFILE
# cpu-profile = ./cpu.pprof

# Exclude files or directories matching the specified globs
# Env $TREEFMT_EXCLUDES
excludes = [
  ".pre-commit-config.yaml",
  "**/node_modules/**",
  "**/target/**",
  "**/.git/**",
  ".cursor/**",
  ".vscode/**",
  # Plan 24: tree-sitter's own generated output (grammar.json,
  # node-types.json) — checked in verbatim as the tree-sitter CLI emits
  # it, the same convention as a compiled TextMate grammar (plan 17).
  # The javascript formatter's `*.json` glob would otherwise reformat
  # these into a different byte-for-byte shape than `tree-sitter
  # generate` produces, fighting that tool on every regeneration.
  "tree-sitter-emerald/src/**",
]

# Exit with error if any changes were made during execution
# Useful for CI
fail-on-change = false

# A list of formatters to apply
# Defaults to all configured formatters
# Env $TREEFMT_FORMATTERS
# formatters = ["gofmt", "prettier"]

# Log paths that did not match any formatters at the specified log level
on-unmatched = "warn"

# The root directory from which treefmt will start walking the filesystem
# Defaults to the directory containing the config file
# Env $TREEFMT_TREE_ROOT
# tree-root = "/tmp/foo"

# File to search for to find the tree root (if tree-root is not set)
# Env $TREEFMT_TREE_ROOT_FILE
# tree-root-file = ".git/config"

# Set the verbosity of logs
verbose = 1

# The method used to traverse the files within the tree root
# Use git to only format tracked files
walk = "git"

# [formatter.mylanguage]
# # Command to execute
# command = "command-to-run"
# # Command-line arguments for the command
# options = []
# # Glob pattern of files to include
# includes = [ "*.<language-extension>" ]
# # Glob patterns of files to exclude
# excludes = []
# # Controls the order of application when multiple formatters match the same file
# # Lower the number, the higher the precedence
# # Default is 0
# priority = 0

[formatter.deadnix]
command = "deadnix"
includes = ["*.nix"]
priority = 0

[formatter.nix]
command = "alejandra"
includes = ["*.nix"]
priority = 1

[formatter.github-actions]
command = "actionlint"
includes = [".github/workflows/*.yml"]
priority = 2

[formatter.bash]
command = "beautysh"
includes = ["*.sh", ".envrc"]
priority = 3

# Bugfix (first-ever `git push` this session): biome's own config
# (biome.json) already ignores lockfiles like `package-lock.json` --
# machine-generated, not meant to be reformatted -- but treefmt still
# handed it to biome, and biome refusing the file (correctly, per its
# own config) came back as a hard treefmt error rather than a skip.
# Excluded here to match biome's own policy instead of fighting it.
[formatter.javascript]
command = "biome"
options = ["format", "--write"]
includes = ["*.{js,jsx,ts,tsx,json}"]
excludes = ["**/package-lock.json"]
priority = 4

[formatter.yaml]
command = "yamlfmt"
includes = ["*.{yml,yaml}"]
priority = 5

[formatter.toml]
command = "taplo"
options = ["format"]
includes = ["*.toml"]
priority = 6

# Bugfix (first-ever `git push` this session): this hardcoded
# `--edition 2024` overrode rustfmt.toml's own `edition` setting (rustfmt
# CLI flags win over config-file settings) -- while every crate here is
# actually `edition = "2021"` (Cargo.toml's workspace.package). Two
# independent sources of truth for the same setting, disagreeing: `moon
# run :format` (this treefmt config) formatted as 2024, then `moon run
# :lint`'s `cargo fmt --all -- --check` (reads rustfmt.toml, no CLI
# override) checked against 2021 -- guaranteed to fail every time, which
# is exactly what happened the first time this pipeline ever actually
# ran end-to-end (no git remote existed before this session, so pre-push
# had never been exercised). Dropped the override; rustfmt.toml's own
# `edition = "2021"` is now the one source of truth both `:format` and
# `:lint` agree on.
[formatter.rust]
command = "rustfmt"
includes = ["*.rs"]
priority = 7
