# Plan 27: publishes editors/vscode/ (the "Emerald Language" extension)
# to the VS Code Marketplace (and, optionally, Open VSX) whenever a
# release tag is pushed. This is a hand-authored workflow, not
# `dist`-generated — cargo-dist only knows about the Rust workspace's
# binaries (see .github/workflows/release.yml, generated by
# `dist generate`); the extension has its own package.json version
# (currently 0.2.0) that is versioned independently of the Cargo
# workspace's `[workspace.package] version` (currently 0.1.0). Pushing
# a tag such as `v0.1.1` triggers *both* workflows: the Rust release
# and this one. This job always publishes whatever `editors/vscode/
# package.json`'s current `version` is — it does not check that the
# pushed tag matches that version. If you need those aligned, bump
# `editors/vscode/package.json`'s `version` yourself before tagging.
#
# REQUIRED SETUP BEFORE THIS CAN PUBLISH FOR REAL (not done by this
# commit — a human maintainer must do this in repo Settings > Secrets
# and variables > Actions):
#   - `VSCE_PAT`: a Personal Access Token for the Azure DevOps
#     organization backing the `emerald-lang` VS Code Marketplace
#     publisher, scoped to Marketplace > Manage. See
#     https://code.visualstudio.com/api/working-with-extensions/publishing-extension#get-a-personal-access-token
#     Without it, the "Publish to VS Code Marketplace" step below fails
#     fast with an explicit error rather than silently no-op'ing.
#   - `OVSX_PAT` (optional): an Open VSX access token, if this project
#     also wants the extension mirrored to https://open-vsx.org. If
#     this secret is absent, the Open VSX step is skipped (not an
#     error) — Open VSX support is optional, VS Code Marketplace is
#     not.
#
# Neither secret exists in this repo as of this commit. This workflow
# has never actually published anything — only `npm ci` / `npm run
# package` (local .vsix packaging, no credentials needed) have been
# verified, by hand, against this exact package.json.
name: VSCode Extension Publish
on:
  push:
    # Matches the tag shapes release.yml (dist-generated) reacts to, so
    # a single tag push can drive both workflows consistently.
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  # Lets a maintainer manually re-run a publish (e.g. retrying only the
  # Open VSX half after fixing OVSX_PAT) without pushing a new tag.
  workflow_dispatch: {}
permissions:
  contents: read
defaults:
  run:
    working-directory: editors/vscode
jobs:
  publish:
    name: Package and publish VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Package extension (.vsix)
        run: npm run package
      - name: Upload .vsix as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-vsix
          path: editors/vscode/*.vsix
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT repository secret is not set. See this workflow's header comment and RELEASING.md for how to create and add it. Refusing to silently skip a real Marketplace publish."
            exit 1
          fi
          npx vsce publish --pat "$VSCE_PAT"
      - name: Publish to Open VSX
        # actionlint disallows the `secrets` context in step `if:`
        # conditions, so the "is OVSX_PAT set" check has to happen
        # inside the script instead of gating the step itself.
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT repository secret is not set. Skipping optional Open VSX publish (VS Code Marketplace publish above is unaffected)."
            exit 0
          fi
          npx ovsx publish --pat "$OVSX_PAT"
